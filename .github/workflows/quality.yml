name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpg-narrativo-ia

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rpg-narrativo-ia/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build PWA
        run: npm run build

  mesa-online:
    name: Mesa Online — test, lint, types, build and browser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mesa-online

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mesa-online/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O lint do Next traz um alerta sem correção (braces/micromatch) só em
      # dependências de desenvolvimento; o que vai para produção é auditado.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Keep browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-online-playwright-report
          path: |
            mesa-online/playwright-report
            mesa-online/test-results
          retention-days: 7
