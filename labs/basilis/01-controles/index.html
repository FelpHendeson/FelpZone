<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Basilis — Lab 01: Controles</title>
  </head>
  <body>
    <canvas id="palco" aria-label="Campo de testes"></canvas>
    <pre id="hud" aria-live="off"></pre>

    <nav class="topo">
      <a href="../../" class="botao-topo">Labs</a>
      <button id="tela-cheia" class="botao-topo" type="button" aria-label="Tela cheia">Tela cheia</button>
      <button id="abrir-ajustes" class="botao-topo" type="button">Ajustes</button>
    </nav>

    <div id="botoes" hidden>
      <button id="botao-esquiva" type="button">Esquiva</button>
      <button id="botao-ataque" type="button">Ataque</button>
    </div>

    <p id="dica">
      <span class="dica-toque">Polegar esquerdo anda. Direito ataca e esquiva.</span>
      <span class="dica-teclado">WASD ou setas andam · J ou Espaço atacam · K ou Shift esquivam</span>
    </p>

    <section id="ajustes" hidden aria-label="Ajustes">
      <header>
        <h2>Ajustes</h2>
        <button id="fechar-ajustes" type="button">Fechar</button>
      </header>
      <div id="ajustes-campos"></div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
